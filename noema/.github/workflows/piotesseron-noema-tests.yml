name: Piotesseron NOEMA Tests

on:
  push:
    branches:
      - main
    paths:
      - "piotesseron_core.py"
      - "noema/**"
      - "tests/test_noema.py"
      - ".github/workflows/piotesseron-noema-tests.yml"

  pull_request:
    branches:
      - main
    paths:
      - "piotesseron_core.py"
      - "noema/**"
      - "tests/test_noema.py"
      - ".github/workflows/piotesseron-noema-tests.yml"

  workflow_dispatch:

jobs:
  noema-containment-tests:
    name: Test NOEMA Constitutional Containment

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest

      - name: Check Python syntax
        run: |
          python -m py_compile piotesseron_core.py
          python -m py_compile noema/__init__.py
          python -m py_compile noema/constitution.py
          python -m py_compile noema/core.py
          python -m py_compile tests/test_noema.py

      - name: Run NOEMA containment tests
        run: |
          python -m pytest tests/test_noema.py -v

      - name: Run NOEMA structural self-check
        run: |
          python - <<'PY'
          from noema import build_noema0

          noema = build_noema0()

          checks = noema.structural_self_check()

          print("=" * 72)
          print("PIOTESSERON — NOEMA STRUCTURAL SELF-CHECK")
          print("=" * 72)

          failed = []

          for name, result in checks.items():
              status = "OK" if result else "FAIL"
              print(f"{name:48s} {status}")

              if not result:
                  failed.append(name)

          print("=" * 72)

          if failed:
              print("NOEMA CONTAINMENT FAILURE")

              for name in failed:
                  print(f" - {name}")

              raise SystemExit(1)

          print("ALL NOEMA CONTAINMENT INVARIANTS: OK")
          PY
